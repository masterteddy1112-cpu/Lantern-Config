# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Loom 1.17+ requires Gradle itself to run on Java 21+ (this is separate
# from the mod's own bytecode target, which stays Java 17 below via
# sourceCompatibility/targetCompatibility/options.release).
# Gradle 9.5.1 supports JVM 17-26 for its daemon, so an installed Java 26 works fine.
# Uncomment and set this if Gradle/VS Code keeps picking up a stale Java 17 JVM.
# Windows example: org.gradle.java.home=C:\\Program Files\\Java\\jdk-26
#org.gradle.java.home=

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.lantern_config

# Dependencies
fabric_api_version=0.92.11+1.20.1
